plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.android') version '1.9.24'
}

android {
    namespace "de.danoeh.antennapod.wear"
    compileSdk 35

    defaultConfig {
        applicationId "de.danoeh.antennapod.wear"
        minSdk 26
        targetSdk 34
        versionCode 3110001
        versionName "3.11.0-wear"

        vectorDrawables.useSupportLibrary true

        testApplicationId "de.danoeh.antennapod.wear.tests"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            minifyEnabled true
            shrinkResources true
            resValue "string", "app_name", "AntennaPod"
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "AntennaPod Debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/LICENSE.txt",
                         "META-INF/NOTICE.txt",
                         "META-INF/CHANGES",
                         "META-INF/README.md"]
        }
    }

    testOptions {
        animationsDisabled = true
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        disable "GradleDependency", "OutdatedLibrary", "AndroidGradlePluginVersion",
                "CheckResult", "UnusedAttribute", "InflateParams",
                "RestrictedApi", "ContentDescription"
        checkDependencies true
        warningsAsErrors true
        abortOnError true
    }

    flavorDimensions += ["market"]
    productFlavors {
        free {
            dimension "market"
        }
        play {
            dimension "market"
        }
    }
}

dependencies {
    // Project modules (reuse existing logic)
    implementation project(':model')
    implementation project(':event')
    implementation project(':storage:database')
    implementation project(':storage:preferences')
    implementation project(':net:common')
    implementation project(':net:sync:gpoddernet')
    implementation project(':net:sync:service-interface')
    implementation project(':net:sync:service')
    implementation project(':net:ssl')
    implementation project(':net:download:service-interface')
    implementation project(':playback:base')
    implementation project(':ui:i18n')
    implementation project(':ui:notifications')
    implementation project(':ui:app-start-intent')

    // Kotlin
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // Wear OS
    implementation "androidx.wear:wear:1.3.0"

    // Compose for Wear OS
    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.wear.compose:compose-material:1.3.1"
    implementation "androidx.wear.compose:compose-foundation:1.3.1"
    implementation "androidx.wear.compose:compose-navigation:1.3.1"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // AndroidX
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.core:core-ktx:$coreVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2"

    // Media3 for playback
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"

    // Network
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "org.apache.commons:commons-lang3:$commonslangVersion"
    implementation "commons-io:commons-io:$commonsioVersion"

    // Reactive
    implementation "io.reactivex.rxjava3:rxandroid:$rxAndroidVersion"
    implementation "io.reactivex.rxjava3:rxjava:$rxJavaVersion"
    implementation "org.greenrobot:eventbus:$eventbusVersion"

    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$testCoreVersion"
}
