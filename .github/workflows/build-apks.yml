name: Build and Release APKs

on:
  push:
    branches: [ master, develop, copilot/add-wear-os-antenna-pod ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

permissions:
  contents: write
  actions: read

jobs:
  build-apks:
    name: "Build APKs"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Create temporary release keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event.inputs.build_variant }}" = "debug" ]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.build_variant }}" = "release" ]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.build_variant }}" = "all" ]; then
            echo "build_type=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "build_type=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/copilot/add-wear-os-antenna-pod" ]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
          else
            echo "build_type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Build APKs (Debug only)
        if: steps.variant.outputs.build_type == 'debug'
        run: |
          ./gradlew :app:assemblePlayDebug :wear:assemblePlayDebug

      - name: Build APKs (Release only)
        if: steps.variant.outputs.build_type == 'release'
        run: |
          ./gradlew :app:assemblePlayRelease :app:assembleFreeRelease :wear:assemblePlayRelease :wear:assembleFreeRelease

      - name: Build APKs (All variants)
        if: steps.variant.outputs.build_type == 'all'
        run: |
          ./gradlew :app:assemblePlayDebug :app:assemblePlayRelease :app:assembleFreeRelease :wear:assemblePlayDebug :wear:assemblePlayRelease :wear:assembleFreeRelease

      - name: Collect APK files
        run: |
          mkdir -p apk-output
          echo "Collecting APK files..."
          
          # Main app APKs
          if [ -d "app/build/outputs/apk" ]; then
            echo "Found app APK directory"
            find app/build/outputs/apk -name "*.apk" -exec cp -v {} apk-output/ \;
          else
            echo "Warning: app/build/outputs/apk not found"
          fi
          
          # Wear OS APKs
          if [ -d "wear/build/outputs/apk" ]; then
            echo "Found wear APK directory"
            find wear/build/outputs/apk -name "*.apk" -exec cp -v {} apk-output/ \;
          else
            echo "Warning: wear/build/outputs/apk not found"
          fi
          
          # List what we found
          echo ""
          echo "Collected APK files:"
          ls -lh apk-output/ || echo "No APKs found!"
          
          # Verify we have files
          if [ -z "$(ls -A apk-output)" ]; then
            echo "ERROR: No APK files were collected!"
            exit 1
          fi

      - name: Upload APKs (Single artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AntennaPod-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built APKs:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for apk in apk-output/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(du -h "$apk" | cut -f1)
              NAME=$(basename "$apk")
              echo "- ✅ **$NAME** ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All APKs are available as a single workflow artifact for download." >> $GITHUB_STEP_SUMMARY

  create-release:
    name: "Create GitHub Release"
    needs: build-apks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-wear-emulator:
    name: "Test Wear OS on Emulator"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Wear OS APK
        run: ./gradlew :wear:assemblePlayDebug --no-daemon

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Wear OS Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wear_round
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "🚀 Starting app startup test..."
            
            # Install the APK
            echo "📦 Installing APK..."
            adb install -r wear/build/outputs/apk/play/debug/wear-play-debug.apk
            
            # Wait for installation
            sleep 2
            
            # Clear logcat
            adb logcat -c
            
            # Start logcat in background
            adb logcat > logcat.txt &
            LOGCAT_PID=$!
            
            # Launch the app
            echo "🎯 Launching app..."
            adb shell am start -W -n de.danoeh.antennapod.play/de.danoeh.antennapod.wear.ui.MainActivity
            
            # Give app time to initialize
            echo "⏱️  Waiting for app to initialize..."
            sleep 10
            
            # Stop logcat
            kill $LOGCAT_PID || true
            
            # Check for crashes
            echo "🔍 Checking logs for errors..."
            
            if grep -q "java.lang.IllegalStateException: WorkManager is already initialized" logcat.txt; then
              echo "❌ FAILURE: WorkManager double initialization detected!"
              grep -A 20 "WorkManager is already initialized" logcat.txt
              exit 1
            fi
            
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "❌ FAILURE: App crashed on startup!"
              grep -A 30 "FATAL EXCEPTION" logcat.txt
              exit 1
            fi
            
            # Check if WorkManager initialized
            if grep -q "WorkManager" logcat.txt; then
              echo "✅ WorkManager logs found"
              grep -i "workmanager" logcat.txt | head -10
            fi
            
            # Check if app started
            if grep -q "WearApplication" logcat.txt; then
              echo "✅ WearApplication initialized"
            fi
            
            if grep -q "MainActivity" logcat.txt; then
              echo "✅ MainActivity started"
            fi
            
            # Verify app is running
            echo "🔎 Checking if app is running..."
            if adb shell ps | grep -q "de.danoeh.antennapod"; then
              echo "✅ SUCCESS: App is running!"
            else
              echo "⚠️  WARNING: App process not found (might have closed)"
            fi
            
            # Display relevant logs
            echo ""
            echo "📝 Relevant logs:"
            grep -i "antennapod\|workmanager\|exception" logcat.txt | tail -30
            
            # Check for any initialization errors
            if grep -q -i "error\|exception\|crash" logcat.txt && grep -q "antennapod" logcat.txt; then
              echo "⚠️  Errors/exceptions found in logs, reviewing..."
              grep -B 5 -A 10 -i "error\|exception" logcat.txt | grep -B 5 -A 10 "antennapod" | tail -40
            fi
            
            echo ""
            echo "✅ Emulator test completed successfully!"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-logs
          path: logcat.txt
          retention-days: 7
