name: Build and Release APKs

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

permissions:
  contents: write
  actions: read

jobs:
  build-apks:
    name: "Build APKs"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Create temporary release keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Build APKs (Debug only)
        if: github.event.inputs.build_variant == 'debug' || (github.event.inputs.build_variant == '' && github.event_name != 'push')
        run: |
          ./gradlew :app:assemblePlayDebug :wear:assemblePlayDebug

      - name: Build APKs (Release only)
        if: github.event.inputs.build_variant == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          ./gradlew :app:assemblePlayRelease :app:assembleFreeRelease :wear:assemblePlayRelease :wear:assembleFreeRelease

      - name: Build APKs (All variants)
        if: github.event.inputs.build_variant == 'all' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          ./gradlew :app:assemblePlayDebug :app:assemblePlayRelease :app:assembleFreeRelease :wear:assemblePlayDebug :wear:assemblePlayRelease :wear:assembleFreeRelease

      - name: Collect APK files
        run: |
          mkdir -p apk-output
          # Main app APKs
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \; || true
          # Wear OS APKs
          find wear/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \; || true
          # List what we found
          ls -lh apk-output/

      - name: Upload APKs (Single artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AntennaPod-APKs
          path: apk-output/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built APKs:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for apk in apk-output/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(du -h "$apk" | cut -f1)
              NAME=$(basename "$apk")
              echo "- ✅ **$NAME** ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All APKs are available as a single workflow artifact for download." >> $GITHUB_STEP_SUMMARY

  create-release:
    name: "Create GitHub Release"
    needs: build-apks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
