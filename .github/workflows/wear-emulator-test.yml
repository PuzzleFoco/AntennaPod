name: Wear OS Emulator Test

on:
  push:
    branches: [ copilot/add-wear-os-antenna-pod ]
    paths:
      - 'wear/**'
      - '.github/workflows/wear-emulator-test.yml'
  pull_request:
    paths:
      - 'wear/**'
  workflow_dispatch:

jobs:
  emulator-test:
    name: Test Wear OS App on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Wear OS APK
        run: ./gradlew :wear:assemblePlayDebug --no-daemon

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Wear OS Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wear_round
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "🚀 Starting app startup test..."
            
            # Install the APK
            echo "📦 Installing APK..."
            adb install -r wear/build/outputs/apk/play/debug/wear-play-debug.apk
            
            # Wait for installation
            sleep 2
            
            # Clear logcat
            adb logcat -c
            
            # Start logcat in background
            adb logcat > logcat.txt &
            LOGCAT_PID=$!
            
            # Launch the app
            echo "🎯 Launching app..."
            adb shell am start -W -n de.danoeh.antennapod.play/de.danoeh.antennapod.wear.ui.MainActivity
            
            # Give app time to initialize
            echo "⏱️  Waiting for app to initialize..."
            sleep 10
            
            # Stop logcat
            kill $LOGCAT_PID || true
            
            # Check for crashes
            echo "🔍 Checking logs for errors..."
            
            if grep -q "java.lang.IllegalStateException: WorkManager is already initialized" logcat.txt; then
              echo "❌ FAILURE: WorkManager double initialization detected!"
              grep -A 20 "WorkManager is already initialized" logcat.txt
              exit 1
            fi
            
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "❌ FAILURE: App crashed on startup!"
              grep -A 30 "FATAL EXCEPTION" logcat.txt
              exit 1
            fi
            
            # Check if WorkManager initialized
            if grep -q "WorkManager" logcat.txt; then
              echo "✅ WorkManager logs found"
              grep -i "workmanager" logcat.txt | head -10
            fi
            
            # Check if app started
            if grep -q "WearApplication" logcat.txt; then
              echo "✅ WearApplication initialized"
            fi
            
            if grep -q "MainActivity" logcat.txt; then
              echo "✅ MainActivity started"
            fi
            
            # Verify app is running
            echo "🔎 Checking if app is running..."
            if adb shell ps | grep -q "de.danoeh.antennapod"; then
              echo "✅ SUCCESS: App is running!"
            else
              echo "⚠️  WARNING: App process not found (might have closed)"
            fi
            
            # Display relevant logs
            echo ""
            echo "📝 Relevant logs:"
            grep -i "antennapod\|workmanager\|exception" logcat.txt | tail -30
            
            # Check for any initialization errors
            if grep -q -i "error\|exception\|crash" logcat.txt && grep -q "antennapod" logcat.txt; then
              echo "⚠️  Errors/exceptions found in logs, reviewing..."
              grep -B 5 -A 10 -i "error\|exception" logcat.txt | grep -B 5 -A 10 "antennapod" | tail -40
            fi
            
            echo ""
            echo "✅ Emulator test completed successfully!"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: logcat.txt
          retention-days: 7
