name: Build and Release APKs

on:
  push:
    branches: [ master, develop, copilot/add-wear-os-antenna-pod ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - '.github/workflows/**'
      - '!.github/workflows/build-apks.yml'
      - '**.png'
      - '**.jpg'
      - '**.svg'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

permissions:
  contents: write
  actions: read

jobs:
  build-apks:
    name: "Build APKs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache Build Outputs
        uses: actions/cache@v4
        with:
          path: |
            app/build
            wear/build
            */build
          key: build-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Configure parallel build
        run: |
          echo "org.gradle.parallel=true" >> local.properties
          echo "org.gradle.caching=true" >> local.properties
          echo "org.gradle.configureondemand=true" >> local.properties

      - name: Create temporary release keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event.inputs.build_variant }}" = "debug" ]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.build_variant }}" = "release" ]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.build_variant }}" = "all" ]; then
            echo "build_type=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "build_type=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/copilot/add-wear-os-antenna-pod" ]; then
            echo "build_type=debug" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
          else
            echo "build_type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Build APKs (Debug only)
        if: steps.variant.outputs.build_type == 'debug'
        run: |
          ./gradlew :app:assemblePlayDebug :wear:assemblePlayDebug

      - name: Build APKs (Release only)
        if: steps.variant.outputs.build_type == 'release'
        run: |
          ./gradlew :app:assemblePlayRelease :app:assembleFreeRelease :wear:assemblePlayRelease :wear:assembleFreeRelease

      - name: Build APKs (All variants)
        if: steps.variant.outputs.build_type == 'all'
        run: |
          ./gradlew :app:assemblePlayDebug :app:assemblePlayRelease :app:assembleFreeRelease :wear:assemblePlayDebug :wear:assemblePlayRelease :wear:assembleFreeRelease

      - name: Collect APK files
        run: |
          mkdir -p apk-output
          echo "Collecting APK files..."
          
          # Main app APKs
          if [ -d "app/build/outputs/apk" ]; then
            echo "Found app APK directory"
            find app/build/outputs/apk -name "*.apk" -exec cp -v {} apk-output/ \;
          else
            echo "Warning: app/build/outputs/apk not found"
          fi
          
          # Wear OS APKs
          if [ -d "wear/build/outputs/apk" ]; then
            echo "Found wear APK directory"
            find wear/build/outputs/apk -name "*.apk" -exec cp -v {} apk-output/ \;
          else
            echo "Warning: wear/build/outputs/apk not found"
          fi
          
          # List what we found
          echo ""
          echo "Collected APK files:"
          ls -lh apk-output/ || echo "No APKs found!"
          
          # Verify we have files
          if [ -z "$(ls -A apk-output)" ]; then
            echo "ERROR: No APK files were collected!"
            exit 1
          fi

      - name: Upload APKs (Single artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AntennaPod-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built APKs:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for apk in apk-output/*.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(du -h "$apk" | cut -f1)
              NAME=$(basename "$apk")
              echo "- ✅ **$NAME** ($SIZE)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All APKs are available as a single workflow artifact for download." >> $GITHUB_STEP_SUMMARY

  create-release:
    name: "Create GitHub Release"
    needs: build-apks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


