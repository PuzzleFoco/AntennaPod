plugins {
    id('com.android.application')
}
apply from: "../common.gradle"

android {
    namespace "de.danoeh.antennapod.wear"

    defaultConfig {
        applicationId "de.danoeh.antennapod.wear"
        versionCode 1000095
        versionName "1.0.0"
        
        minSdk 26  // Wear OS 2.0 and higher (Pixel Watch 1 support)
        targetSdk 35
        
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [eventBusIndex: 'de.danoeh.antennapod.wear.ApWearEventBusIndex']
            }
        }
    }

    // Product flavors matching the main app and library modules
    flavorDimensions += ["market"]
    productFlavors {
        free {
            dimension "market"
        }
        play {
            dimension "market"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Core modules
    implementation project(':event')
    implementation project(':model')
    implementation project(':net:common')
    implementation project(':net:sync:service-interface')
    implementation project(':net:sync:service')
    implementation project(':playback:base')
    implementation project(':storage:database')
    implementation project(':storage:preferences')
    implementation project(':ui:i18n')

    // AndroidX Core
    implementation "androidx.core:core:$coreVersion"
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.preference:preference:$preferenceVersion"
    
    // Wear OS
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.support:wearable:2.9.0'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    
    // RecyclerView for lists
    implementation "androidx.recyclerview:recyclerview:$recyclerViewVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.fragment:fragment:$fragmentVersion"
    
    // Media
    implementation "androidx.media:media:$mediaVersion"
    implementation "androidx.media3:media3-session:$media3Version"
    
    // Work Manager for sync
    implementation "androidx.work:work-runtime:$workManagerVersion"
    
    // Other dependencies
    implementation "org.apache.commons:commons-lang3:$commonslangVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "org.greenrobot:eventbus:$eventbusVersion"
    annotationProcessor "org.greenrobot:eventbus-annotation-processor:$eventbusVersion"
    implementation "io.reactivex.rxjava3:rxandroid:$rxAndroidVersion"
    implementation "io.reactivex.rxjava3:rxjava:$rxJavaVersion"
    
    // Glide for image loading
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    annotationProcessor "com.github.bumptech.glide:compiler:$glideVersion"
    
    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$testCoreVersion"
}
